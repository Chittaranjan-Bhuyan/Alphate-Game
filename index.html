<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Drag & Drop Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎓 Drag the Letters to the Correct Place</h1>

    <div class="container">

        <!-- Placeholders -->
        <div id="placeholders-container">

            <div class="placeholder" data-letter="A">A</div>
            <div class="placeholder" data-letter="B">B</div>
            <div class="placeholder" data-letter="C">C</div>
            <div class="placeholder" data-letter="D">D</div>
            <div class="placeholder" data-letter="E">E</div>
            <div class="placeholder" data-letter="F">F</div>
            <div class="placeholder" data-letter="G">G</div>
            <div class="placeholder" data-letter="H">H</div>
            <div class="placeholder" data-letter="I">I</div>
            <div class="placeholder" data-letter="J">J</div>
            <div class="placeholder" data-letter="K">K</div>
            <div class="placeholder" data-letter="L">L</div>
            <div class="placeholder" data-letter="M">M</div>
            <div class="placeholder" data-letter="N">N</div>
            <div class="placeholder" data-letter="O">O</div>
            <div class="placeholder" data-letter="P">P</div>
            <div class="placeholder" data-letter="Q">Q</div>
            <div class="placeholder" data-letter="R">R</div>
            <div class="placeholder" data-letter="S">S</div>
            <div class="placeholder" data-letter="T">T</div>
            <div class="placeholder" data-letter="U">U</div>
            <div class="placeholder" data-letter="V">V</div>
            <div class="placeholder" data-letter="W">W</div>
            <div class="placeholder" data-letter="X">X</div>
            <div class="placeholder" data-letter="Y">Y</div>
            <div class="placeholder" data-letter="Z">Z</div>

        </div>

        <!-- Random Letters -->
        <div id="letters-container">

            <div class="letter" draggable="true" id="letter-A">A</div>
            <div class="letter" draggable="true" id="letter-B">B</div>
            <div class="letter" draggable="true" id="letter-C">C</div>
            <div class="letter" draggable="true" id="letter-D">D</div>
            <div class="letter" draggable="true" id="letter-E">E</div>
            <div class="letter" draggable="true" id="letter-F">F</div>
            <div class="letter" draggable="true" id="letter-G">G</div>
            <div class="letter" draggable="true" id="letter-H">H</div>
            <div class="letter" draggable="true" id="letter-I">I</div>
            <div class="letter" draggable="true" id="letter-J">J</div>
            <div class="letter" draggable="true" id="letter-K">K</div>
            <div class="letter" draggable="true" id="letter-L">L</div>
            <div class="letter" draggable="true" id="letter-M">M</div>
            <div class="letter" draggable="true" id="letter-N">N</div>
            <div class="letter" draggable="true" id="letter-O">O</div>
            <div class="letter" draggable="true" id="letter-P">P</div>
            <div class="letter" draggable="true" id="letter-Q">Q</div>
            <div class="letter" draggable="true" id="letter-R">R</div>
            <div class="letter" draggable="true" id="letter-S">S</div>
            <div class="letter" draggable="true" id="letter-T">T</div>
            <div class="letter" draggable="true" id="letter-U">U</div>
            <div class="letter" draggable="true" id="letter-V">V</div>
            <div class="letter" draggable="true" id="letter-W">W</div>
            <div class="letter" draggable="true" id="letter-X">X</div>
            <div class="letter" draggable="true" id="letter-Y">Y</div>
            <div class="letter" draggable="true" id="letter-Z">Z</div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
